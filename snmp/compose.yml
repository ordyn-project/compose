name: ordyn-snmp

services:
  snmp:
    image: docker.hank-it.com/ordyn/snmp:${SNMP_TAG:-stable}
    restart: always
    init: true
    env_file:
      - .env
    ports:
      - "162:9162/udp"
    volumes:
      - snmp-data:/data
    labels:
      - "cosign.verify=keys/ordyn-2026-06.pub"
    healthcheck:
      test: 'wget -qO- "http://127.0.0.1:$${PORT:-8080}/healthz" >/dev/null || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  snmp-data:
