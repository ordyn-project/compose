name: ordyn-webhooks

services:
  webhooks:
    image: docker.hank-it.com/ordyn/webhooks:${WEBHOOKS_TAG:-stable}
    restart: always
    init: true
    env_file:
      - .env
    volumes:
      - webhooks-data:/data
    networks:
      - frontend
    labels:
      - "cosign.verify=keys/ordyn-2026-06.pub"
      - "traefik.enable=true"
      - "traefik.http.services.ordyn-webhooks.loadbalancer.server.port=${PORT:-8080}"
      - "traefik.http.services.ordyn-webhooks.loadbalancer.server.scheme=http"
      - "traefik.http.routers.ordyn-webhooks-ingress.rule=Host(`${SERVICE_DOMAIN:?err}`) && PathPrefix(`/v1/hooks/`)"
      - "traefik.http.routers.ordyn-webhooks-ingress.entrypoints=websecure"
      - "traefik.http.routers.ordyn-webhooks-ingress.service=ordyn-webhooks"
    healthcheck:
      test: 'wget -qO- "http://127.0.0.1:$${PORT:-8080}/healthz" >/dev/null || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webhooks-data:

networks:
  frontend:
    name: ${FRONTEND_NETWORK_NAME:-frontend}
    external: true
