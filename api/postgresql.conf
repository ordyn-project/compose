# Ordyn PostgreSQL profile.

listen_addresses '*'

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = 500ms
log_temp_files = 64MB

shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 8MB
maintenance_work_mem = 1GB
autovacuum_work_mem = 512MB

max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

random_page_cost = 1.1
effective_io_concurrency = 128
maintenance_io_concurrency = 128

io_method = worker
io_workers = 4

autovacuum_max_workers = 6
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.03
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 3000

max_locks_per_transaction = 256
jit = off

# Retained installation diagnostics. Collector changes require a restart.
logging_collector = on
log_destination = 'jsonlog'
log_directory = '/var/log/ordyn-postgres'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 60min
log_rotation_size = 64MB
log_truncate_on_rotation = off
log_timezone = 'UTC'
log_lock_waits = on
# Preserve PostgreSQL's normal deadlock detection interval.
deadlock_timeout = 1s
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
