services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${FRONTEND_NETWORK_NAME:-frontend}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=lets-encrypt"
      - "--certificatesresolvers.lets-encrypt.acme.email=${TRAEFIK_ACME_EMAIL:-}"
      - "--certificatesresolvers.lets-encrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.lets-encrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.lets-encrypt.acme.dnschallenge.provider=${TRAEFIK_DNS_PROVIDER:?TRAEFIK_DNS_PROVIDER must be set}"
      - "--certificatesresolvers.lets-encrypt.acme.dnschallenge.resolvers=${TRAEFIK_DNS_RESOLVERS:-1.1.1.1:53,8.8.8.8:53}"
      - "--api.dashboard=false"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
    env_file:
      - .env
