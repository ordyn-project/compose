name: ordyn-package-discovery

services:
  package-discovery:
    image: docker.hank-it.com/ordyn/package-discovery:${PACKAGE_DISCOVERY_TAG:-stable}
    restart: always
    init: true
    env_file:
      - .env
    volumes:
      - package-discovery-data:/data
    labels:
      - "cosign.verify=keys/ordyn-2026-06.pub"
      - "traefik.enable=false"
    healthcheck:
      test: 'wget -qO- "http://127.0.0.1:$${PORT:-8080}/healthz" >/dev/null || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  package-discovery-data:
